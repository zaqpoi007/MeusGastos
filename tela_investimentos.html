<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Financeiro - Investimentos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: #12121c; color: #ffffff; display: flex; justify-content: center; }
        .mobile-container { width: 100%; max-width: 414px; background-color: #161622; min-height: 100vh; position: relative; box-shadow: 0 0 20px rgba(0,0,0,0.5); display: flex; flex-direction: column; padding-bottom: 90px; overflow-x: hidden; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 30px 25px 20px; }
        .header-title { font-size: 1.2rem; font-weight: 600; }
        .header-btn { background: none; border: none; color: #ffffff; font-size: 1.2rem; cursor: pointer; }

        .balance-section { text-align: center; padding: 10px 25px 20px; }
        .balance-title { font-size: 0.85rem; color: #a0a0b0; margin-bottom: 5px; }
        .balance-amount { font-size: 2.5rem; font-weight: 700; color: #2ed573; }
        
        .investments-section { background-color: #1b1b28; border-top-left-radius: 30px; border-top-right-radius: 30px; padding: 30px 25px; flex-grow: 1; box-shadow: 0 -5px 20px rgba(0,0,0,0.2); }
        .invest-card { background: linear-gradient(135deg, #1e1e2d, #252535); border-radius: 16px; padding: 20px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid #b070f0; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
        .invest-details h4 { font-size: 1rem; font-weight: 600; margin-bottom: 4px; }
        .invest-details p { font-size: 0.75rem; color: #a0a0b0; }
        .invest-total { font-size: 1.1rem; font-weight: 700; text-align: right; }

        .bottom-nav { position: fixed; bottom: 0; width: 100%; max-width: 414px; background-color: #161622; display: flex; justify-content: space-around; padding: 20px 0 25px; border-top: 1px solid #252535; z-index: 10; }
        .nav-item { color: #6a6a80; font-size: 1.2rem; text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .nav-item span { font-size: 0.65rem; }
        .nav-item.active { color: #b070f0; }
    </style>
</head>
<body>
    <div class="mobile-container">
        <header>
            <button class="header-btn" onclick="window.location.href='index.html'"><i class="fa-solid fa-chevron-left"></i></button>
            <h1 class="header-title">Meus Investimentos</h1>
            <button class="header-btn"><i class="fa-solid fa-magnifying-glass"></i></button>
        </header>

        <div class="balance-section">
            <div class="balance-title">Patrimônio Total</div>
            <div class="balance-amount" id="patrimonioTotal">R$ 0,00</div>
        </div>

        <div class="investments-section" id="container-investimentos">
            <div class="section-header"><div class="section-title">Meus Ativos</div></div>
            <p style="text-align:center; color:#a0a0b0; padding-top: 20px;">A carregar...</p>
        </div>

        <nav class="bottom-nav">
            <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i><span>Home</span></a>
            <a href="tela_cartoes.html" class="nav-item"><i class="fa-regular fa-credit-card"></i><span>Cartões</span></a>
            <a href="tela_projetos.html" class="nav-item"><i class="fa-solid fa-suitcase-rolling"></i><span>Projetos</span></a>
            <a href="tela_investimentos.html" class="nav-item active"><i class="fa-solid fa-chart-pie"></i><span>Investir</span></a>
            <a href="tela_ajustes.html" class="nav-item"><i class="fa-solid fa-gear"></i><span>Ajustes</span></a>
        </nav>
    </div>

    <script>
        // URL da API atualizada para o Google Apps Script
        const API_URL = "https://script.google.com/macros/s/AKfycbx3B5YDUe-_-uZmSeBU5RPGV0GgZ4g13VF9GJlS2B5Exn51gjhEDIytThTxLhXAl5F85A/exec";

        window.onload = function() {
            const userId = localStorage.getItem('appFinanceiro_userId');
            if(userId) carregarInvestimentos(userId);
        };

        async function carregarInvestimentos(userId) {
            const cacheInvestimentos = localStorage.getItem(`cache_investimentos_${userId}`);
            
            if (cacheInvestimentos) {
                renderizarInvestimentos(JSON.parse(cacheInvestimentos));
            }

            try {
                const res = await fetch(`${API_URL}?sheet=investimentos_carteira&id_usuario=${userId}`);
                const ativos = await res.json();
                
                localStorage.setItem(`cache_investimentos_${userId}`, JSON.stringify(ativos));
                renderizarInvestimentos(ativos);

            } catch(e) { 
                console.error(e);
                if (!cacheInvestimentos) {
                    document.getElementById('container-investimentos').innerHTML = '<p style="text-align:center; color:red;">Erro ao carregar ativos.</p>';
                }
            }
        }

        function renderizarInvestimentos(ativos) {
            const container = document.getElementById('container-investimentos');
            if(ativos.length === 0 || ativos.error) {
                container.innerHTML = `
                    <div style="text-align:center; padding: 40px 20px; color:#a0a0b0;">
                        <i class="fa-solid fa-piggy-bank" style="font-size: 3rem; margin-bottom: 15px;"></i>
                        <h3>Carteira vazia</h3>
                        <p>Adicione o seu primeiro investimento via lançamentos.</p>
                    </div>`;
                return;
            }

            let html = '<div class="section-header"><div class="section-title">Meus Ativos</div></div>';
            let totalInvestido = 0;

            ativos.forEach(a => {
                let valor = parseFloat(a.valor_total_investido || 0);
                totalInvestido += valor;
                html += `
                <div class="invest-card">
                    <div class="invest-details">
                        <h4>${a.id_ativo}</h4>
                        <p>${a.tipo}</p>
                    </div>
                    <div class="invest-total">R$ ${valor.toFixed(2)}</div>
                </div>`;
            });

            container.innerHTML = html;
            document.getElementById('patrimonioTotal').innerText = `R$ ${totalInvestido.toFixed(2)}`;
        }
    </script>
</body>
</html>
