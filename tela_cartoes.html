<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Financeiro - Cartões</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: #12121c; color: #ffffff; display: flex; justify-content: center; }
        .mobile-container { width: 100%; max-width: 414px; background-color: #161622; min-height: 100vh; position: relative; box-shadow: 0 0 20px rgba(0,0,0,0.5); display: flex; flex-direction: column; padding-bottom: 90px; overflow-x: hidden; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 30px 25px 20px; }
        .header-title { font-size: 1.2rem; font-weight: 600; }
        .header-btn { background: none; border: none; color: #ffffff; font-size: 1.2rem; cursor: pointer; }
        
        .cards-carousel { display: flex; flex-wrap: nowrap; overflow-x: auto; scroll-snap-type: x mandatory; padding: 10px 25px 30px; gap: 15px; -webkit-overflow-scrolling: touch; }
        .cards-carousel::-webkit-scrollbar { height: 4px; }
        .cards-carousel::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.05); border-radius: 4px; }
        .cards-carousel::-webkit-scrollbar-thumb { background: #b070f0; border-radius: 4px; }
        .card-wrapper { flex: 0 0 85%; scroll-snap-align: center; transition: transform 0.3s ease; }
        
        .credit-card { border-radius: 20px; padding: 25px; height: 200px; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.3); user-select: none; }
        
        /* Temas */
        .tema-roxo { background: linear-gradient(135deg, #8A05BE, #5c0382); }
        .tema-azul { background: linear-gradient(135deg, #003DA5, #002666); color: #F2C14E !important; }
        .tema-verde { background: linear-gradient(135deg, #007A5E, #00523e); }
        .tema-vermelho { background: linear-gradient(135deg, #cf1d30, #900c1b); }
        .tema-laranja { background: linear-gradient(135deg, #ff7e5f, #feb47b); }
        .tema-preto { background: linear-gradient(135deg, #2b2b2b, #121212); }
        
        .add-card-btn { background: linear-gradient(135deg, #1b1b28, #252535); border: 2px dashed #3a3a50; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: all 0.3s ease; }
        .add-card-btn:active { transform: scale(0.98); background: #252535; }
        .add-card-btn i { font-size: 3rem; color: #3b82f6; margin-bottom: 12px; }
        .add-card-btn span { font-size: 1.1rem; font-weight: 600; color: #ffffff; text-align: center; line-height: 1.2; }

        .card-top { display: flex; justify-content: space-between; align-items: flex-start; }
        .bank-name { font-weight: 700; font-size: 1.1rem; letter-spacing: 1px; }
        .card-middle { margin-top: auto; margin-bottom: 15px; }
        .card-balance-label { font-size: 0.75rem; opacity: 0.8; }
        .card-balance { font-size: 1.8rem; font-weight: 700; }
        .card-limit { font-size: 0.85rem; font-weight: 400; opacity: 0.8; margin-top: 2px; }
        
        .card-bottom { display: flex; justify-content: space-between; align-items: flex-end; }
        .card-info-inferior { font-size: 0.85rem; font-weight: 600; opacity: 0.9; }
        .card-network { font-weight: 700; font-style: italic; }
        
        .transactions-section { background-color: #1b1b28; border-top-left-radius: 30px; border-top-right-radius: 30px; padding: 30px 25px; flex-grow: 1; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .section-title { font-size: 1.1rem; font-weight: 600; }
        .section-subtitle { font-size: 0.8rem; color: #a0a0b0; background: rgba(255,255,255,0.1); padding: 4px 10px; border-radius: 12px; }
        .transaction-list { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .transaction-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #252535; }
        .transaction-item:last-child { border-bottom: none; }
        .trans-left { display: flex; align-items: center; gap: 15px; }
        .trans-icon { width: 45px; height: 45px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; background-color: rgba(138, 5, 190, 0.2); color: #b070f0; }
        .trans-details h4 { font-size: 0.95rem; font-weight: 600; margin-bottom: 4px; }
        .trans-details p { font-size: 0.75rem; color: #a0a0b0; text-transform: capitalize; }
        .trans-amount { font-weight: 600; font-size: 0.95rem; }
        
        .bottom-nav { position: fixed; bottom: 0; width: 100%; max-width: 414px; background-color: #161622; display: flex; justify-content: space-around; padding: 20px 0 25px; border-top: 1px solid #252535; z-index: 10; }
        .nav-item { color: #6a6a80; font-size: 1.2rem; text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .nav-item span { font-size: 0.65rem; }
        .nav-item.active { color: #b070f0; }
        
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.7); backdrop-filter: blur(5px); z-index: 100; justify-content: center; align-items: flex-end; }
        .modal-content { background-color: #1b1b28; width: 100%; max-width: 414px; border-top-left-radius: 25px; border-top-right-radius: 25px; padding: 30px 25px; animation: slideUp 0.3s ease; box-shadow: 0 -5px 25px rgba(0,0,0,0.5); max-height: 90vh; overflow-y: auto; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .modal-header h3 { font-size: 1.2rem; font-weight: 600; }
        .close-btn { background: none; border: none; color: #a0a0b0; font-size: 1.5rem; cursor: pointer; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 0.85rem; color: #a0a0b0; margin-bottom: 8px; }
        .form-control { width: 100%; background-color: #12121c; color: #ffffff; border: 1px solid #252535; border-radius: 12px; padding: 14px 15px; font-size: 1rem; outline: none; transition: border 0.3s; }
        .form-control:focus { border-color: #b070f0; }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); }
        .payment-toggle { display: flex; gap: 10px; }
        .payment-toggle input[type="radio"] { display: none; }
        .toggle-btn-modal { flex: 1; text-align: center; padding: 12px 5px; background-color: #12121c; border: 1px solid #252535; border-radius: 12px; cursor: pointer; font-size: 0.75rem; color: #a0a0b0; transition: all 0.3s ease; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 600; }
        .toggle-btn-modal i { font-size: 1.2rem; margin-bottom: 6px; }
        .payment-toggle input[type="radio"]:checked + .toggle-btn-modal { background-color: #251e3e; border-color: #b070f0; color: #ffffff; }
        .btn-primary { width: 100%; background: linear-gradient(90deg, #5c2b99, #b070f0); color: #ffffff; border: none; border-radius: 12px; padding: 16px; font-size: 1rem; font-weight: 600; margin-top: 10px; cursor: pointer; box-shadow: 0 4px 15px rgba(92, 43, 153, 0.4); }
    </style>
</head>
<body>

    <div class="mobile-container">
        <header>
            <button class="header-btn" onclick="window.location.href='index.html'"><i class="fa-solid fa-chevron-left"></i></button>
            <h1 class="header-title">Meus Cartões</h1>
            <button class="header-btn" onclick="openExpenseModal()"><i class="fa-solid fa-plus"></i></button>
        </header>

        <div class="cards-carousel" id="cardSlider">
            <div class="card-wrapper" id="addCardBtnWrapper">
                <div class="credit-card add-card-btn" onclick="openNewCardModal()">
                    <i class="fa-solid fa-plus"></i>
                    <span>Adicionar<br>Novo Cartão</span>
                </div>
            </div>
            <div style="flex: 0 0 5%;" id="cardSpacer"></div>
        </div>

        <div class="transactions-section">
            <div class="section-header">
                <div class="section-title">Últimas Transações</div>
                <div class="section-subtitle" id="nomeCartaoFoco">Carregando...</div>
            </div>
            <div id="lista-lancamentos-cartao" class="transaction-list">
                <p style="text-align:center; color:#a0a0b0;">Carregando...</p>
            </div>
        </div>

        <nav class="bottom-nav">
            <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i><span>Home</span></a>
            <a href="tela_cartoes.html" class="nav-item"><i class="fa-regular fa-credit-card"></i><span>Cartões</span></a>
            <a href="tela_lembretes.html" class="nav-item"><i class="fa-regular fa-bell"></i><span>Lembretes</span></a>
            <a href="tela_projetos.html" class="nav-item"><i class="fa-solid fa-suitcase-rolling"></i><span>Projetos</span></a>
            <a href="tela_investimentos.html" class="nav-item"><i class="fa-solid fa-chart-pie"></i><span>Investir</span></a>
            <a href="tela_ajustes.html" class="nav-item"><i class="fa-solid fa-gear"></i><span>Ajustes</span></a>
        </nav>
    </div>

    <div id="newCardModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Adicionar Cartão</h3>
                <button class="close-btn" onclick="closeNewCardModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <form id="newCardForm">
                <div class="form-group">
                    <label>Nome do Banco ou Cartão</label>
                    <input type="text" id="bancoInput" class="form-control" placeholder="Ex: Nubank, Itaú, Caju..." required>
                </div>
                
                <div style="display: flex; gap: 15px;">
                    <div class="form-group" style="flex: 1;">
                        <label>Tipo</label>
                        <select class="form-control" id="tipoCartaoSelect" required>
                            <option value="Cartão de Crédito">Crédito</option>
                            <option value="Conta Corrente">Conta / Débito</option>
                            <option value="Vale Refeição">Benefício / Vale</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Dia de Fechamento</label>
                        <input type="number" id="fechamentoCartaoInput" class="form-control" placeholder="Ex: 15" min="1" max="31" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Limite Total ou Saldo Inicial</label>
                    <input type="number" step="0.01" id="limiteCartaoInput" class="form-control" placeholder="R$ 0.00" required>
                </div>

                <div class="form-group">
                    <label>Cor do Cartão</label>
                    <select class="form-control" id="temaCartaoSelect" required>
                        <option value="tema-roxo">Roxo (Ex: Nubank)</option>
                        <option value="tema-azul">Azul (Ex: BB, Caixa)</option>
                        <option value="tema-verde">Verde (Ex: Alelo, Sicredi)</option>
                        <option value="tema-vermelho">Vermelho (Ex: Santander, Bradesco)</option>
                        <option value="tema-laranja">Laranja (Ex: Inter)</option>
                        <option value="tema-preto">Preto (Ex: Black/Carbon)</option>
                    </select>
                </div>

                <button type="button" class="btn-primary" id="btnSaveCard" onclick="saveNewCard()">Adicionar à Carteira</button>
            </form>
        </div>
    </div>

    <div id="expenseModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Novo Lançamento</h3>
                <button class="close-btn" onclick="closeExpenseModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <form id="expenseForm">
                <div class="form-group">
                    <label>Tipo de Lançamento</label>
                    <div class="payment-toggle" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;">
                        
                        <input type="radio" id="pay-income" name="paymentType" value="receita">
                        <label for="pay-income" class="toggle-btn-modal" style="border-color: #2ed57340;">
                            <i class="fa-solid fa-money-bills" style="color: #2ed573;"></i>
                            <span style="color: #2ed573;">Receita</span>
                        </label>

                        <input type="radio" id="pay-credit" name="paymentType" value="credito" checked>
                        <label for="pay-credit" class="toggle-btn-modal">
                            <i class="fa-regular fa-credit-card"></i>
                            <span>Crédito</span>
                        </label>
                        
                        <input type="radio" id="pay-debit" name="paymentType" value="debito">
                        <label for="pay-debit" class="toggle-btn-modal">
                            <i class="fa-solid fa-money-bill-transfer"></i>
                            <span>Débito/Pix</span>
                        </label>
                        
                        <input type="radio" id="pay-invest" name="paymentType" value="investimento">
                        <label for="pay-invest" class="toggle-btn-modal">
                            <i class="fa-solid fa-arrow-trend-up"></i>
                            <span>Investir</span>
                        </label>
                        
                    </div>
                </div>

                <div class="form-group" id="cartaoGroup">
                    <label>Cartão Utilizado</label>
                    <select class="form-control" id="cartaoUtilizadoSelect" required>
                        <option value="" disabled selected>Selecione um cartão</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Título / Estabelecimento</label>
                    <input type="text" id="tituloInput" class="form-control" placeholder="Ex: Supermercado Extra" required>
                </div>
                <div class="form-group">
                    <label>Valor (R$)</label>
                    <input type="text" inputmode="numeric" id="valorInput" class="form-control" placeholder="0,00" required>
                </div>
                <div style="display: flex; gap: 15px;">
                    <div class="form-group" style="flex: 1;">
                        <label>Data</label>
                        <input type="date" id="dataInput" class="form-control" required>
                    </div>
                    <div class="form-group" id="installmentsGroup" style="flex: 1;">
                        <label>Parcelas</label>
                        <select class="form-control" id="installmentsSelect">
                            <option value="1">À vista</option>
                            <option value="2">2 vezes</option>
                            <option value="3">3 vezes</option>
                            <option value="4">4 vezes</option>
                            <option value="5">5 vezes</option>
                            <option value="6">6 vezes</option>
                            <option value="7">7 vezes</option>
                            <option value="8">8 vezes</option>
                            <option value="9">9 vezes</option>
                            <option value="10">10 vezes</option>
                            <option value="11">311vezes</option>
                            <option value="12">3 12ezes</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Categoria</label>
                    <select class="form-control" id="categorySelect" required>
                        <option value="" disabled selected>Selecione uma categoria</option>
                    </select>
                </div>

                <button type="button" class="btn-primary" id="btnSaveExpense" onclick="saveExpense()">Adicionar Gasto</button>
            </form>
        </div>
    </div>

    <div id="loginModal" class="modal-overlay" style="align-items: center; background-color: #12121c; z-index: 9999;">
        <div class="modal-content" style="border-radius: 25px; transform: none; animation: none;">
            <div style="text-align: center; margin-bottom: 20px;">
                <i class="fa-solid fa-wallet" style="font-size: 3rem; color: #b070f0; margin-bottom: 15px;"></i>
                <h3 style="font-size: 1.5rem;">Bem-vindo(a)</h3>
                <p style="color: #a0a0b0; font-size: 0.9rem; margin-top: 5px;">Configure seu acesso para sincronizar com a planilha.</p>
            </div>
            <div class="form-group">
                <label>Como quer ser chamado(a)?</label>
                <input type="text" id="loginNameInput" class="form-control" placeholder="Ex: João Silva" required>
            </div>
            <div class="form-group">
                <label>Seu ID de Usuário Único</label>
                <input type="text" id="loginIdInput" class="form-control" placeholder="Ex: joao123" required>
                <p style="font-size: 0.75rem; color: #6a6a80; margin-top: 5px;">Este ID separará seus dados dos de outros usuários.</p>
            </div>
            <button type="button" class="btn-primary" onclick="salvarLogin()">Acessar Conta</button>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbx3B5YDUe-_-uZmSeBU5RPGV0GgZ4g13VF9GJlS2B5Exn51gjhEDIytThTxLhXAl5F85A/exec";
        
        let globalGastos = [];
        let globalCartoes = [];
        let cartaoFocoAtualId = null;
        let timeoutScroll;
        let isFirstRender = true;

        window.onload = function() {
            verificarLogin();
            const userId = localStorage.getItem('appFinanceiro_userId');
            if(userId) {
                document.getElementById('cardSlider').addEventListener('scroll', () => {
                    clearTimeout(timeoutScroll);
                    timeoutScroll = setTimeout(detectarCartaoCentral, 150);
                });
                carregarCartoesDinamicamente(userId);
            }
        };

        function verificarLogin() {
            const savedId = localStorage.getItem('appFinanceiro_userId');
            const savedName = localStorage.getItem('appFinanceiro_userName');
            
            if (!savedId || !savedName) {
                document.getElementById('loginModal').style.display = 'flex';
            } else {
                document.getElementById('loginModal').style.display = 'none';
            }
        }

        function salvarLogin() {
            const nameInput = document.getElementById('loginNameInput');
            const idInput = document.getElementById('loginIdInput');
            
            const nameVal = nameInput.value.trim();
            const idVal = idInput.value.trim();

            if (!nameVal || !idVal) {
                idInput.style.borderColor = '#cf1d30';
                nameInput.style.borderColor = '#cf1d30';
                setTimeout(() => {
                    idInput.style.borderColor = '#252535';
                    nameInput.style.borderColor = '#252535';
                }, 1000);
                return;
            }

            const cleanId = idVal.toLowerCase().replace(/\s+/g, '');
            localStorage.setItem('appFinanceiro_userName', nameVal);
            localStorage.setItem('appFinanceiro_userId', cleanId);
            
            document.getElementById('loginModal').style.display = 'none';
            window.location.reload();
        }

        function formatarMoedaParaNumero(valor) {
            if (!valor) return 0;

            if (typeof valor === 'number') return valor;

            let formatado = valor.toString().trim().replace(/[R$\s]/g, '');

            if (formatado.includes(',')) {
                formatado = formatado.replace(/\./g, '').replace(',', '.');
            }
            
            return parseFloat(formatado) || 0;
        }

        document.getElementById('valorInput').addEventListener('input', function (e) {
            let value = e.target.value.replace(/\D/g, '');
            if (!value) {
                e.target.value = '';
                return;
            }
            value = (parseInt(value, 10) / 100).toFixed(2);
            value = value.replace('.', ',');
            value = value.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
            e.target.value = value;
        });

        async function carregarCartoesDinamicamente(userId) {
            const cacheCartoes = localStorage.getItem(`cache_cartoes_${userId}`);
            const cacheLancamentos = localStorage.getItem(`cache_lancamentos_${userId}`);

            if (cacheCartoes && cacheLancamentos) {
                renderizarCartoes(JSON.parse(cacheCartoes), JSON.parse(cacheLancamentos));
            }

            try {
                const [resCartoes, resGastos] = await Promise.all([
                    fetch(`${API_URL}?sheet=cartoes&id_usuario=${userId}`),
                    fetch(`${API_URL}?sheet=lancamentos&id_usuario=${userId}`)
                ]);
                
                const cartoes = await resCartoes.json();
                const todosGastos = await resGastos.json();

                localStorage.setItem(`cache_cartoes_${userId}`, JSON.stringify(cartoes));
                localStorage.setItem(`cache_lancamentos_${userId}`, JSON.stringify(todosGastos));
                
                renderizarCartoes(cartoes, todosGastos);
            } catch (e) {
                console.error("Erro ao carregar cartões:", e);
            }
        }

        function renderizarCartoes(cartoes, todosGastos) {
            globalCartoes = cartoes.error ? [] : cartoes;
            globalGastos = todosGastos.error ? [] : todosGastos;
            
            const cartaoSelect = document.getElementById('cartaoUtilizadoSelect');
            cartaoSelect.innerHTML = '<option value="" disabled selected>Selecione um cartão</option>';
            globalCartoes.forEach(c => {
                cartaoSelect.innerHTML += `<option value="${c.id_cartao}">${c.nome_banco}</option>`;
            });
            
            const slider = document.getElementById('cardSlider');
            const addBtnWrapper = document.getElementById('addCardBtnWrapper');
            const spacer = document.getElementById('cardSpacer');
            
            slider.innerHTML = ''; 

            if(!cartoes.error && cartoes.length > 0) {
                cartoes.forEach(c => {
                    const icone = c.tipo.includes("Crédito") ? '<i class="fa-brands fa-cc-mastercard" style="font-size: 2rem; opacity: 0.8;"></i>' : '<div style="width: 40px; height: 30px; background: linear-gradient(135deg, #e0e0e0, #999); border-radius: 5px;"></div>';
                    
                    let labelDestaque = "Saldo Disponível";
                    let saldoInicial = formatarMoedaParaNumero(c.valor);
                    let valorDestaque = 0; 
                    let subValorHTML = "";
                    
                    // Lê o dia do fechamento (ou pega o antigo final_cartao caso ainda tenha salvo assim na planilha)
                    let diaExibicao = c.dia_fechamento || c.final_cartao || "--";
                    let infoInferior = "";

                    let faturaCredito = 0;
                    let receitasConta = 0;
                    let gastosConta = 0;

                    if (!todosGastos.error) {
                        todosGastos.forEach(g => {
                            if(String(g.id_cartao) === String(c.id_cartao)) {
                                const valor = formatarMoedaParaNumero(g.valor);
                                if (g.tipo_pagamento === 'credito') {
                                    faturaCredito += valor;
                                } else if (g.tipo_pagamento === 'receita') {
                                    receitasConta += valor;
                                } else {
                                    gastosConta += valor;
                                }
                            }
                        });
                    }

                    if (c.tipo.includes("Crédito")) {
                        labelDestaque = "Fatura Atual";
                        valorDestaque = faturaCredito;
                        
                        let limiteTotal = saldoInicial; 
                        subValorHTML = `<div class="card-limit">Limite: R$ ${limiteTotal.toFixed(2)}</div>`;
                        
                        let percentual = limiteTotal > 0 ? (faturaCredito / limiteTotal) * 100 : 0;
                        // NOVO: Combina a data de fechamento com a porcentagem do limite
                        infoInferior = `Fecha dia ${diaExibicao} • ${percentual.toFixed(1)}% Usado`;
                        
                    } else {
                        valorDestaque = receitasConta - gastosConta;
                        
                        // NOVO: Textos customizados para Vales ou Conta Corrente
                        if (c.tipo === "Vale Refeição") {
                            infoInferior = `Recarga dia ${diaExibicao}`;
                        } else {
                            infoInferior = `Atualizado hoje`;
                        }
                    }

                    const htmlCartao = `
                    <div class="card-wrapper" data-id-cartao="${c.id_cartao}" data-nome-banco="${c.nome_banco}">
                        <div class="credit-card ${c.tema}">
                            <div class="card-top">
                                <span class="bank-name">${c.nome_banco}</span>
                                ${icone}
                            </div>
                            <div class="card-middle">
                                <div class="card-balance-label">${labelDestaque}</div>
                                <div class="card-balance">R$ ${valorDestaque.toFixed(2)}</div>
                                ${subValorHTML}
                            </div>
                            <div class="card-bottom">
                                <div class="card-info-inferior">${infoInferior}</div>
                                <div class="card-network">${c.tipo}</div>
                            </div>
                        </div>
                    </div>`;
                    
                    slider.insertAdjacentHTML('beforeend', htmlCartao);
                });
            }
            
            slider.appendChild(addBtnWrapper);
            slider.appendChild(spacer);

            if (typeof isFirstRender !== 'undefined' && isFirstRender) {
                slider.scrollLeft = 0;
                isFirstRender = false;
            }

            detectarCartaoCentral();
        }

        function detectarCartaoCentral() {
            const slider = document.getElementById('cardSlider');
            const wrappers = document.querySelectorAll('.card-wrapper');
            if (wrappers.length === 0) return;

            let cartaoMaisAoCentro = null;
            let menorDistancia = Infinity;
            
            const centroCarrossel = slider.getBoundingClientRect().left + (slider.offsetWidth / 2);

            wrappers.forEach(wrapper => {
                const rect = wrapper.getBoundingClientRect();
                const centroDoWrapper = rect.left + (rect.width / 2);
                const distancia = Math.abs(centroCarrossel - centroDoWrapper);

                if (distancia < menorDistancia) {
                    menorDistancia = distancia;
                    cartaoMaisAoCentro = wrapper;
                }
            });

            if (cartaoMaisAoCentro) {
                const idCartao = cartaoMaisAoCentro.getAttribute('data-id-cartao');
                const nomeBanco = cartaoMaisAoCentro.getAttribute('data-nome-banco');

                if (idCartao && idCartao !== cartaoFocoAtualId) {
                    cartaoFocoAtualId = idCartao;
                    renderizarGastos(idCartao, nomeBanco);
                } else if (!idCartao && cartaoFocoAtualId !== 'novo') {
                    cartaoFocoAtualId = 'novo';
                    document.getElementById('nomeCartaoFoco').innerText = "Novo Cartão";
                    document.getElementById('lista-lancamentos-cartao').innerHTML = '<p style="text-align:center; color:#a0a0b0;">Adicione um cartão para ver os gastos.</p>';
                }
            }
        }

        function renderizarGastos(idCartao, nomeBanco) {
            document.getElementById('nomeCartaoFoco').innerText = nomeBanco;
            const container = document.getElementById('lista-lancamentos-cartao');
            
            const cartao = globalCartoes.find(c => String(c.id_cartao) === String(idCartao));
            
            const gastosFiltrados = globalGastos.filter(g => {
                if (String(g.id_cartao) !== String(idCartao)) return false;
                
                if (cartao && cartao.tipo.includes("Crédito")) {
                    return g.tipo_pagamento === 'credito'; 
                } else {
                    return g.tipo_pagamento !== 'credito'; 
                }
            });

            if(gastosFiltrados.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#a0a0b0;">Nenhuma transação para este cartão/conta.</p>';
                return;
            }

            // NOVO: Ordena a lista pelas datas (da mais recente para a mais antiga)
            const gastosOrdenados = [...gastosFiltrados].sort((a, b) => {
                return new Date(b.data) - new Date(a.data);
            });

            let html = '';
            // Substituímos o .reverse() pelo nosso array já ordenado cronologicamente
            gastosOrdenados.forEach(l => {
                const valorLimpo = formatarMoedaParaNumero(l.valor);
                
                let dataFormatada = l.data;
                if (dataFormatada && dataFormatada.includes("T")) {
                    dataFormatada = dataFormatada.split("T")[0];
                }

                let corValor = '';
                let sinal = '-R$ ';
                let icone = 'fa-tag';
                
                if (l.tipo_pagamento === 'receita') {
                    corValor = 'color: #2ed573;';
                    sinal = '+R$ ';
                    icone = 'fa-money-bills';
                } else if (l.tipo_pagamento === 'investimento') {
                    icone = 'fa-arrow-trend-up';
                }

                html += `
                <div class="transaction-item">
                    <div class="trans-left">
                        <div class="trans-icon"><i class="fa-solid ${icone}"></i></div>
                        <div class="trans-details">
                            <h4>${l.titulo}</h4>
                            <p>${l.categoria} • ${dataFormatada}</p> 
                        </div>
                    </div>
                    <div class="trans-amount" style="${corValor}">${sinal}${valorLimpo.toFixed(2)}</div>
                </div>`;
            });
            container.innerHTML = html;
        }

        function openNewCardModal() { document.getElementById('newCardModal').style.display = 'flex'; }
        function closeNewCardModal() { document.getElementById('newCardModal').style.display = 'none'; document.getElementById('newCardForm').reset(); }

        async function saveNewCard() {
            const userId = localStorage.getItem('appFinanceiro_userId');
            const banco = document.getElementById('bancoInput').value;
            const tipo = document.getElementById('tipoCartaoSelect').value;
            const diaFechamento = document.getElementById('fechamentoCartaoInput').value;
            const valor = document.getElementById('limiteCartaoInput').value;
            const tema = document.getElementById('temaCartaoSelect').value;

            if(!banco || !diaFechamento || !valor) return alert("Preencha todos os campos do cartão.");

            const btn = document.getElementById('btnSaveCard');
            btn.innerText = "Salvando..."; btn.style.opacity = "0.7";

            const payload = {
                id_cartao: Date.now().toString(),
                id_usuario: userId,
                nome_banco: banco,
                tipo: tipo,
                valor: valor,
                dia_fechamento: diaFechamento, // Atualizado para a nova coluna
                tema: tema
            };

            try {
                await fetch(API_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        sheet: "cartoes",
                        action: "create",
                        ...payload
                    })
                });

                closeNewCardModal();
                btn.innerText = "Adicionar à Carteira"; btn.style.opacity = "1";
                setTimeout(() => carregarCartoesDinamicamente(userId), 1500);
            } catch (error) {
                alert("Erro ao salvar! Tente novamente.");
                btn.innerText = "Adicionar à Carteira";
            }
        }

        function openExpenseModal() { 
            document.getElementById('expenseModal').style.display = 'flex'; 
            document.getElementById('dataInput').valueAsDate = new Date(); 
            
            const cartaoSelect = document.getElementById('cartaoUtilizadoSelect');
            if(cartaoFocoAtualId && cartaoFocoAtualId !== 'novo') {
                cartaoSelect.value = cartaoFocoAtualId;
            } else {
                cartaoSelect.value = ""; 
            }

            cartaoSelect.dispatchEvent(new Event('change'));
        }
        function closeExpenseModal() { document.getElementById('expenseModal').style.display = 'none'; document.getElementById('expenseForm').reset(); }

        async function saveExpense() {
            const userId = localStorage.getItem('appFinanceiro_userId');
            const tipo = document.querySelector('input[name="paymentType"]:checked').value;
            const titulo = document.getElementById('tituloInput').value;
            const valorDigitado = document.getElementById('valorInput').value;
            const data = document.getElementById('dataInput').value;
            const parcelas = document.getElementById('installmentsSelect').value;
            const categoria = document.getElementById('categorySelect').value;
            const idCartaoSelecionado = document.getElementById('cartaoUtilizadoSelect').value;

            if(!idCartaoSelecionado) return alert("Selecione em qual cartão ocorreu o gasto!");
            if(!titulo || !valorDigitado || !data || !categoria) return alert("Preencha título, valor e categoria!");
            
            const valorNumerico = formatarMoedaParaNumero(valorDigitado);
            if (valorNumerico <= 0) return alert("Preencha um valor válido maior que zero!");

            const btn = document.getElementById('btnSaveExpense');
            btn.innerText = "Salvando..."; btn.style.opacity = "0.7";

            const payloadLancamento = {
                id_lancamento: Date.now().toString(),
                id_usuario: userId,
                id_cartao: idCartaoSelecionado,
                tipo_pagamento: tipo,
                titulo: titulo,
                valor: valorNumerico, 
                data: data,
                parcelas: parcelas,
                categoria: categoria,
                detalhes: "",
                id_projeto: ""
            };

            globalGastos.push(payloadLancamento);
            
            localStorage.setItem(`cache_lancamentos_${userId}`, JSON.stringify(globalGastos));
            
            const slider = document.getElementById('cardSlider');
            const scrollAtual = slider.scrollLeft;

            cartaoFocoAtualId = null; 
            renderizarCartoes(globalCartoes, globalGastos);
            
            setTimeout(() => { document.getElementById('cardSlider').scrollLeft = scrollAtual; }, 10);

            try {
                await fetch(API_URL, { 
                    method: 'POST', 
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify({
                        sheet: "lancamentos",
                        action: "create",
                        ...payloadLancamento
                    }) 
                });

                if (tipo === 'investimento') {
                    const payloadInvestimento = {
                        id_usuario: userId,
                        id_ativo: titulo, 
                        tipo: categoria,  
                        valor_total_investido: valorNumerico
                    };
                    await fetch(API_URL, { 
                        method: 'POST', 
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' }, 
                        body: JSON.stringify({
                            sheet: "investimentos_carteira",
                            action: "create",
                            ...payloadInvestimento
                        }) 
                    });
                }

                //alert("Registro adicionado com sucesso!");
                closeExpenseModal();
                btn.innerText = "Adicionar Gasto"; 
                btn.style.opacity = "1";
                
            } catch (error) { 
                alert("Erro ao salvar na planilha. Tente novamente."); 
                btn.innerText = "Adicionar Gasto"; 
                btn.style.opacity = "1";
            }
        }

        function atualizarInterfaceUX() {
            const tipoPagamento = document.querySelector('input[name="paymentType"]:checked').value;
            const idCartao = document.getElementById('cartaoUtilizadoSelect').value;
            
            const cartao = globalCartoes.find(c => String(c.id_cartao) === String(idCartao));
            
            const isVale = cartao && (cartao.tipo === "Vale Refeição" || cartao.nome_banco.toLowerCase().includes('alelo'));

            const group = document.getElementById('installmentsGroup');
            const selectCategoria = document.getElementById('categorySelect');
            const btnSave = document.getElementById('btnSaveExpense');
            
            if(tipoPagamento === 'debito' || tipoPagamento === 'investimento' || tipoPagamento === 'receita') {
                group.style.opacity = '0.4'; 
                group.style.pointerEvents = 'none'; 
                document.getElementById('installmentsSelect').value = "1";
            } else {
                group.style.opacity = '1'; 
                group.style.pointerEvents = 'auto';
            }

            selectCategoria.innerHTML = '<option value="" disabled selected>Selecione uma categoria</option>'; 
            
            if (tipoPagamento === 'receita') {
                selectCategoria.innerHTML += `
                    <option value="Salário">Salário / Remuneração</option>
                    <option value="Transferência Recebida">Transferência / Pix</option>
                    <option value="Rendimentos">Rendimentos</option>
                    <option value="Outras Entradas">Outras Entradas</option>
                `;
                btnSave.innerText = "Adicionar Receita";
                
            } else if (tipoPagamento === 'investimento') {
                selectCategoria.innerHTML += `
                    <option value="Reserva de Emergência">Reserva de Emergência</option>
                    <option value="Fundo Imobiliário">Fundo Imobiliário (FII)</option>
                    <option value="Ações">Ações</option>
                    <option value="Criptomoedas">Criptomoedas</option>
                    <option value="Renda Fixa">Renda Fixa (CDB/Tesouro)</option>
                    <option value="Outros Investimentos">Outros</option>
                `;
                btnSave.innerText = "Adicionar Investimento";
                
            } else if (isVale) {
                selectCategoria.innerHTML += `
                    <option value="mercado">Mercado</option>
                    <option value="padaria">Padaria</option>
                    <option value="almoco">Almoço</option>
                    <option value="jantar">Jantar</option>
                    <option value="lanchonete">Lanchonete</option>
                    <option value="outro">Outro</option>
                `;
                btnSave.innerText = "Adicionar Gasto";

            } else {
                selectCategoria.innerHTML += `
                    <option value="alimentacao">Alimentação (Jantares/Ifood)</option>
                    <option value="mercado">Supermercado</option>
                    <option value="transporte">Transporte</option>
                    <option value="lazer">Lazer</option>
                    <option value="saude">Saúde</option>
                    <option value="moradia">Moradia</option>
                    <option value="outros">Outros</option>
                `;
                btnSave.innerText = "Adicionar Gasto";
            }
        }

        document.querySelectorAll('input[name="paymentType"]').forEach(radio => {
            radio.addEventListener('change', atualizarInterfaceUX);
        });

        document.getElementById('cartaoUtilizadoSelect').addEventListener('change', (e) => {
            const cartao = globalCartoes.find(c => String(c.id_cartao) === String(e.target.value));
            
            if (cartao) {
                const isAlelo = cartao.nome_banco.toLowerCase().includes('alelo');
                
                if (cartao.tipo === "Vale Refeição" || isAlelo) {
                    document.getElementById('pay-debit').checked = true;
                } else if (cartao.tipo === "Cartão de Crédito") {
                    document.getElementById('pay-credit').checked = true;
                } else if (cartao.tipo === "Conta Corrente") {
                    document.getElementById('pay-debit').checked = true;
                }
            }
            atualizarInterfaceUX();
        });
    </script>
